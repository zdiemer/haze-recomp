; F6 deliberately reloads this file while running; results appear in the title bar.
; Display/monitor/window/render/shadow sizes still require restarting Haze.
; Environment variables and launcher overrides take precedence.
[graphics]
; windowed, fullscreen (DXGI fullscreen), borderless (desktop-sized window)
display_mode = borderless
; auto: up to 1280x720, fitted to the selected monitor's work area
; Or WIDTHxHEIGHT for an exact windowed client size, independent of rendering
window_size = auto
; primary, or a 1-based monitor number from the boot log
monitor = primary
; auto: selected monitor's desktop resolution (physical pixels)
; Or native (original game resolution), or WIDTHxHEIGHT, e.g. 1920x1080
render_resolution = auto
; off or fxaa (postprocess AA; also smooths UI)
anti_aliasing = off
; 1 (game filtering), 2, 4, 8, 16; applies to filtered mipmapped color textures
anisotropic_filtering = 1
; follow (render scale), native (2048), 1024, 2048, 4096, 8192
shadow_resolution = native
; -2..2: negative selects sharper mip levels; can increase shimmering
mip_lod_bias = 0
; 0..1: contrast-limited image sharpening
sharpening = 0
; -2..2: image brightness in exposure stops
exposure = 0
; auto (existing pacing), on, off
vsync = auto
; 0 = uncapped, otherwise 1..240; game timing above 30 FPS is unverified
frame_limit = 30
