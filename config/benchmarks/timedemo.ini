; Frozen graphics profile for the frame-locked benchmark (diagnose.py
; timedemo-run). Separate from the user's editable configuration so results
; stay comparable across releases.
[graphics]
render_resolution = 2560x1440
anti_aliasing = fxaa
anisotropic_filtering = 16
shadow_resolution = 8192
mip_lod_bias = 0
sharpening = 0.15
exposure = 0
vsync = off
frame_limit = 0
display_mode = borderless
window_size = 1280x720
monitor = primary
