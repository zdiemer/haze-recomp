; Copy this file beside HazeLauncher.exe as launcher.ini to override defaults.
; UTF-8. Do not quote values. Empty values retain the built-in/build defaults.
; InstallRoot is relative to the launcher directory. Other relative paths are
; relative to InstallRoot, never the directory you launched from.
[Launcher]
InstallRoot=
SharedRoot=
Executable=
DiscDirectory=
Firmware=
Savedata=
ShaderCache=
Sessions=
InputConfig=
GraphicsConfig=
InputMode=Auto
RenderResolution=
