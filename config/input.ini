; Keyboard bindings accept A-Z, 0-9, Space, Enter, Escape, Tab, Shift, Ctrl,
; Alt, Up/Down/Left/Right, Mouse1..Mouse5, Backspace, Delete, Insert, Home, End,
; PageUp, PageDown, F2..F12 (except F6), or None. Click/F1 captures the mouse.
; Escape pauses and releases it. The capturing click does not fire a weapon.
; Settings > Control Setup can rebind these inputs. Apply saves and reloads;
; Back discards staged edits. Escape cancels capture; F1/F6 remain reserved.
; Button names refer to Haze's controller layout; changing its layout in-game
; changes the action assigned to that button here too.
[Bindings]
Forward=W
Backward=S
StrafeLeft=A
StrafeRight=D
Cross=Space
Circle=X
Square=E
Triangle=R
L1=G
R1=Mouse1
L2=Q
R2=F
L3=Ctrl
R3=Mouse2
Start=Enter
Select=Tab
Up=Up
Down=Down
Left=Left
Right=Right

[Mouse]
; Degrees of camera rotation per raw device count, independent of frame time.
Sensitivity=0.10
InvertY=0

; SDL gamepad names describe physical positions (south/east/west/north).
; Changes to this file reload while the game is running, within half a second.
; Raw sources also work: raw:b0 (button), raw:h0.1 (hat up; 2/4/8 right/down/left),
; raw:+a0 / raw:-a0 (axis direction), raw:a0 (full axis). Indices start at zero.
; Axis rows accept full axes; a minus sign reverses an axis. None unbinds.
[Controller]
MoveX=leftx
MoveY=lefty
LookX=rightx
LookY=righty
MoveDeadzone=0.15
LookDeadzone=0.12
TriggerDeadzone=0.05
InvertLookY=0
; auto, xbox, playstation, switch. Override useful for Steam virtual pads.
IconFamily=auto
; Optional SDL mapping database path, relative to this INI. Enables custom
; button/axis/hat mappings for hardware SDL does not recognize out of the box.
; Removing or replacing a previously loaded mapping file requires a restart
; to discard its old SDL mappings. See docs/control-settings.md.
MappingFile=

[ControllerBindings]
Cross=south
Circle=east
Square=west
Triangle=north
L1=leftshoulder
R1=rightshoulder
L2=lefttrigger
R2=righttrigger
L3=leftstick
R3=rightstick
Start=start
Select=back
Up=dpup
Down=dpdown
Left=dpleft
Right=dpright

[Prompts]
Enabled=1
; Relative to this INI. PNG edits reload within half a second.
Directory=../assets/input-prompts

[Startup]
; The current media backend cannot display logo movies. 0 waits for the current
; Cross/confirm binding instead; it does not enable movie playback.
AutoSkipLogos=1
; Independent idle-demo policy; neither option skips campaign story movies.
AutoSkipAttract=1
