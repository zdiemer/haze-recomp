name: Asset-free Windows checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install pinned LLVM
        shell: powershell
        run: |
          choco install llvm --version=20.1.8 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed' }
          "HAZE_LLVM_ROOT=C:\Program Files\LLVM" >> $env:GITHUB_ENV
      - name: Run existing asset-free regressions
        shell: powershell
        run: ./scripts/ci.ps1 -Python (Get-Command python).Source
      - name: Validate MSI authoring without game inputs
        shell: powershell
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path build/wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          python tests/test_installer.py build/wix/wix.exe
          if ($LASTEXITCODE -ne 0) { throw 'MSI validation failed' }
      - name: Retain test and configuration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-logs
          retention-days: 14
          path: |
            local/ci/
            build/**/Testing/Temporary/*.log
            build/**/CMakeFiles/CMakeConfigureLog.yaml
